<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful - Trading Tournament</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f14;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }

    .box {
      width: 90%;
      max-width: 450px;
      padding: 35px 20px;
      background: #151b23;
      border-radius: 15px;
      box-sizing: border-box;
    }

    .check {
      font-size: 60px;
      margin-bottom: 15px;
    }

    h1 {
      margin: 10px 0;
      font-size: 28px;
    }

    p {
      color: #b8c0cc;
      line-height: 1.6;
    }

    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 13px 25px;
      background: #16c784;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .button:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>

  <div class="box">
    <div class="check">✓</div>

    <h1>Payment Successful</h1>

    <p>
      Thank you for your payment.
      Your Trading Tournament payment has been received.
    </p>

    <p>
      You can now return to the Trading Tournament website.
    </p>

    <a class="button" href="index.html">
      Back to Trading Tournament
    </a>
  </div>

</body>
</html>
