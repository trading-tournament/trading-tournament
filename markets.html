<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trading League | Markets</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#06110d;
color:white;
font-family:Arial,sans-serif;
}

a{
text-decoration:none;
color:inherit;
}

nav{
background:#040e0a;
border-bottom:1px solid #183027;
padding:12px 15px;
}

.nav{
max-width:1100px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
}

.brand{
font-weight:900;
}

.logo{
display:inline-grid;
place-items:center;
width:34px;
height:34px;
background:#18df98;
color:#03110b;
border-radius:9px;
margin-right:6px;
}

.links{
display:flex;
gap:10px;
overflow-x:auto;
}

.links a{
font-size:11px;
color:#91a39c;
}

.links a:hover{
color:#18df98;
}


main{
max-width:1100px;
margin:auto;
padding:25px 15px;
}


h1{
font-size:28px;
}


.subtitle{
color:#91a39c;
font-size:12px;
}


.search{
width:100%;
margin:20px 0;
padding:14px;
background:#10251c;
border:1px solid #183027;
border-radius:10px;
color:white;
outline:none;
}


.grid{

display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px;

}


.coin{

background:#10251c;
border:1px solid #183027;
border-radius:14px;
padding:16px;
cursor:pointer;
transition:.2s;

}


.coin:hover{

border-color:#18df98;
transform:translateY(-2px);

}


.icon{

width:45px;
height:45px;
border-radius:12px;
background:#06110d;
display:grid;
place-items:center;
color:#18df98;
font-size:20px;
font-weight:bold;
margin-bottom:12px;

}


.name{

font-weight:900;
font-size:14px;

}


.symbol{

color:#91a39c;
font-size:11px;
margin-top:5px;

}


footer{

text-align:center;
color:#60716a;
font-size:11px;
margin:40px;

}


@media(max-width:700px){

.grid{
grid-template-columns:repeat(2,1fr);
}

.nav{
flex-direction:column;
align-items:flex-start;
}

}

</style>

</head>

<body>


<nav>

<div class="nav">

<a href="index.html" class="brand">
<span class="logo">TL</span>
Trading League
</a>


<div class="links">

<a href="index.html">Home</a>
<a href="markets.html">Markets</a>
<a href="games.html">Games</a>
<a href="tournament.html">Tournament</a>
<a href="leaderboard.html">Leaderboard</a>
<a href="withdraw.html">Withdraw</a>
<a href="account.html">Account</a>

</div>

</div>

</nav>



<main>

<h1>Markets</h1>

<p class="subtitle">
Select a cryptocurrency market to view live price and trading.
</p>


<input 
class="search"
id="search"
placeholder="Search crypto..."
>


<div class="grid" id="marketGrid"></div>


</main>



<footer>
Trading League © 2026
</footer>



<script>


const markets={

BTC:["Bitcoin","₿"],
ETH:["Ethereum","Ξ"],
BNB:["BNB","B"],
SOL:["Solana","S"],
XRP:["XRP","X"],
DOGE:["Dogecoin","Ð"],
ADA:["Cardano","A"],
AVAX:["Avalanche","A"],
LINK:["Chainlink","L"],
DOT:["Polkadot","●"],
TRX:["TRON","T"],
POL:["Polygon","M"],
LTC:["Litecoin","Ł"],
BCH:["Bitcoin Cash","₿"],
XLM:["Stellar","X"],
UNI:["Uniswap","U"],
ATOM:["Cosmos","A"],
NEAR:["NEAR Protocol","N"],
ICP:["Internet Computer","I"],
APT:["Aptos","A"]

};



const grid=document.getElementById("marketGrid");


function showMarkets(filter=""){


grid.innerHTML="";


Object.keys(markets).forEach(symbol=>{


let coin=markets[symbol];


if(
!symbol.toLowerCase().includes(filter) &&
!coin[0].toLowerCase().includes(filter)
){
return;
}



let div=document.createElement("div");

div.className="coin";


div.onclick=function(){

window.location.href=
"market.html?symbol="+symbol;

};



div.innerHTML=`

<div class="icon">
${coin[1]}
</div>

<div class="name">
${coin[0]}
</div>

<div class="symbol">
${symbol}/USDT
</div>

`;


grid.appendChild(div);


});


}



document
.getElementById("search")
.addEventListener("input",function(){

showMarkets(
this.value.toLowerCase()
);

});


showMarkets();


</script>


</body>
</html>
