<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading League - Markets</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial, sans-serif;
}

body{
    background:#07111f;
    color:white;
}

header{
    background:#0d1b2e;
    padding:20px;
    text-align:center;
    border-bottom:1px solid #1d3557;
}

header h1{
    color:#00ff99;
}

nav{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:15px;
    padding:15px;
    background:#091525;
}

nav a{
    color:white;
    text-decoration:none;
    padding:10px 15px;
    border-radius:8px;
    background:#13263f;
}

nav a:hover{
    background:#00ff99;
    color:black;
}

.container{
    padding:20px;
}

.title{
    text-align:center;
    margin-bottom:25px;
}

.title h2{
    color:#00ff99;
}

.market-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.coin-card{
    background:#102238;
    border:1px solid #1d3557;
    border-radius:15px;
    padding:20px;
    text-align:center;
    transition:0.3s;
}

.coin-card:hover{
    transform:translateY(-5px);
    border-color:#00ff99;
}

.logo{
    width:60px;
    height:60px;
    margin:auto;
    border-radius:50%;
    background:#00ff99;
    color:#07111f;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:22px;
    font-weight:bold;
    margin-bottom:15px;
}

.coin-card h3{
    margin-bottom:10px;
}

.coin-card button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#00ff99;
    color:#07111f;
    font-weight:bold;
    cursor:pointer;
}

.coin-card button:hover{
    background:white;
}

footer{
    margin-top:30px;
    padding:20px;
    text-align:center;
    background:#0d1b2e;
    color:#aaa;
}
</style>
</head>

<body>

<header>
<h1>Trading League</h1>
<p>Crypto Markets</p>
</header>

<nav>
<a href="index.html">Home</a>
<a href="markets.html">Markets</a>
<a href="games.html">Games</a>
<a href="tournament.html">Tournament</a>
<a href="leaderboard.html">Leaderboard</a>
<a href="withdraw.html">Withdraw</a>
<a href="account.html">Account</a>
</nav>

<div class="container">

<div class="title">
<h2>Markets</h2>
<p>Select a cryptocurrency to start demo trading</p>
</div>

<div class="market-grid" id="marketGrid"></div>

</div>

<footer>
Trading League © 2026
</footer>


<script>

const cryptocurrencies = [
{name:"Bitcoin", symbol:"BTC"},
{name:"Ethereum", symbol:"ETH"},
{name:"BNB", symbol:"BNB"},
{name:"Solana", symbol:"SOL"},
{name:"XRP", symbol:"XRP"},
{name:"Dogecoin", symbol:"DOGE"},
{name:"Cardano", symbol:"ADA"},
{name:"Avalanche", symbol:"AVAX"},
{name:"Chainlink", symbol:"LINK"},
{name:"Polkadot", symbol:"DOT"},
{name:"TRON", symbol:"TRX"},
{name:"Polygon", symbol:"POL"},
{name:"Litecoin", symbol:"LTC"},
{name:"Bitcoin Cash", symbol:"BCH"},
{name:"Stellar", symbol:"XLM"},
{name:"Uniswap", symbol:"UNI"},
{name:"Cosmos", symbol:"ATOM"},
{name:"NEAR Protocol", symbol:"NEAR"},
{name:"Internet Computer", symbol:"ICP"},
{name:"Aptos", symbol:"APT"}
];


const marketGrid = document.getElementById("marketGrid");


cryptocurrencies.forEach(coin=>{

const card=document.createElement("div");

card.className="coin-card";

card.innerHTML=`

<div class="logo">${coin.symbol.substring(0,1)}</div>

<h3>${coin.name}</h3>

<p>${coin.symbol}</p>

<br>

<button onclick="openMarket('${coin.symbol}')">
Trade ${coin.symbol}
</button>

`;

marketGrid.appendChild(card);

});


function openMarket(symbol){

window.location.href="market.html?symbol="+symbol;

}

</script>

</body>
</html>
