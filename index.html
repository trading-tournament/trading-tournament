<!DOCTYPE html><html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TradeLeague</title>
<style>
body{margin:0;background:#07111f;color:white;font-family:Arial}
header{text-align:center;background:#111c2d;padding:15px}
h1{color:#22c55e}
main{max-width:700px;margin:auto;padding:10px 10px 70px}
.card{background:#111c2d;border:1px solid #26354a;border-radius:12px;padding:14px;margin:10px 0}
input,button,select{width:100%;padding:12px;margin:5px 0;border-radius:8px;box-sizing:border-box}
input,select{background:#07111f;color:white;border:1px solid #334155}
button{background:#22c55e;border:0;font-weight:bold}
.red{background:#ef4444;color:white}
.gray{background:#334155;color:white}
.hidden{display:none}
.green{color:#22c55e}
.redtext{color:#ef4444}
.yellow{color:#facc15}
.balance{font-size:30px;font-weight:bold}
.price{font-size:21px;font-weight:bold}
.market{background:#0b1627;padding:12px;border-radius:9px;margin:7px 0}
.nav{position:fixed;bottom:0;left:0;right:0;background:#111827;display:flex}
.nav button{background:none;color:white;font-size:10px;margin:0}
table{width:100%;border-collapse:collapse}
td,th{padding:8px;border-bottom:1px solid #26354a;text-align:left}
#chart{width:100%;height:200px;background:#07111f;border-radius:8px}
</style>
</head><body><header>
<h1>🔥 TradeLeague</h1>
<small>DEMO TEST MODE</small>
</header><main><div id="loading" class="card">
Checking account...
</div><div id="login" class="card hidden">
<h2>🔐 Login</h2>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button id="loginBtn">Login</button>
<button id="signupBtn" class="gray">Create Account</button>
<p id="message"></p>
</div><div id="app" class="hidden"><section id="home"><div class="card">
<h2 id="tname">Starter Tournament</h2>
<div class="balance">$<span id="balance">500.00</span></div>
<p>Time: <b id="timer" class="yellow">--</b></p>
</div><div class="card">
<h2>🏆 Tournaments</h2>
<div id="tournaments"></div>
</div><div class="card">
<h2>🌍 Markets</h2>
<div id="markets"></div>
</div></section><section id="trade" class="hidden"><div class="card">
<h2>📈 <span id="marketName">Market</span></h2><div class="price">$<span id="price">0</span></div><p>Movement:
<b id="movement">0%</b>
</p><canvas id="chart"></canvas>

<input id="amount" type="number" placeholder="Demo amount"><button id="buy">🟢 BUY</button>
<button id="sell" class="red">🔴 SELL</button>

<p id="tradeMessage"></p>
</div><div class="card">
<h3>Open Trades</h3>
<div id="positions">None</div>
</div></section><section id="rank" class="hidden"><div class="card">
<h2>🏆 Live Leaderboard</h2><select id="boardSelect"></select>

<p>Time:
<b id="boardTimer" class="yellow">--</b>
</p><table>
<thead>
<tr>
<th>#</th>
<th>Trader</th>
<th>Balance</th>
<th>Profit</th>
</tr>
</thead><tbody id="board">
<tr><td colspan="4">Loading...</td></tr>
</tbody>
</table><p id="boardStatus">
🔴 LIVE — updates automatically.
</p></div></section><section id="account" class="hidden"><div class="card">
<h2>👤 Account</h2>
<p id="userEmail"></p>
<p>Balance: $<b id="accountBalance">500.00</b></p>
<button id="logout" class="red">Logout</button>
</div></section></div>
</main><nav id="nav" class="nav hidden"><button onclick="show('home')">🏠<br>Home</button>
<button onclick="show('trade')">📈<br>Trade</button>
<button onclick="show('rank')">🏆<br>Rank</button>
<button onclick="show('account')">👤<br>Account</button>

</nav><script type="module">

import{initializeApp}
from"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import{
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut,
setPersistence,
browserLocalPersistence
}
from"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

import{
getFirestore,
doc,
getDoc,
setDoc,
collection,
query,
orderBy,
onSnapshot
}
from"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


/* PUT YOUR EXISTING FIREBASE CONFIG HERE */

const firebaseConfig={
apiKey:"YOUR_API_KEY",
authDomain:"YOUR_AUTH_DOMAIN",
projectId:"YOUR_PROJECT_ID",
storageBucket:"YOUR_STORAGE_BUCKET",
messagingSenderId:"YOUR_MESSAGING_SENDER_ID",
appId:"YOUR_APP_ID"
};


const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

await setPersistence(auth,browserLocalPersistence);


const $=x=>document.getElementById(x);


/* TOURNAMENTS */

const T={
starter:{
name:"Starter Tournament",
entry:2,
days:6
},
five:{
name:"$5 Tournament",
entry:5,
days:1
},
ten:{
name:"$10 Tournament",
entry:10,
days:3
}
};


let user=null;
let tournament="starter";
let balance=500;
let positions=[];
let market=null;
let unsubscribe=null;


/* MARKETS */

const M={
"BTC/USD":65000,
"ETH/USD":3200,
"Gold":2380,
"Apple":210,
"Tesla":240,
"Nvidia":120,
"EUR/USD":1.085,
"GBP/USD":1.274
};


const old={};

for(let x in M)old[x]=M[x];


/* PAGE */

window.show=x=>{

["home","trade","rank","account"]
.forEach(p=>$(p).classList.add("hidden"));

$(x).classList.remove("hidden");

if(x=="rank")leaderboard();

};


/* AUTH */

$("loginBtn").onclick=async()=>{

try{

await signInWithEmailAndPassword(
auth,
$("email").value,
$("password").value
);

}catch(e){

$("message").textContent=e.message;

}

};


$("signupBtn").onclick=async()=>{

try{

await createUserWithEmailAndPassword(
auth,
$("email").value,
$("password").value
);

}catch(e){

$("message").textContent=e.message;

}

};


$("logout").onclick=()=>signOut(auth);


/* PLAYER */

function ref(){

return doc(
db,
"tournaments",
tournament,
"players",
user.uid
);

}


async function load(){

const s=await getDoc(ref());

if(s.exists()){

let d=s.data();

balance=Number(d.balance??500);
positions=d.positions||[];

}else{

balance=500;
positions=[];

}

ui();

}


/* SAVE */

async function save(){

await setDoc(ref(),{

uid:user.uid,
trader:user.email.split("@")[0],
email:user.email,
balance:balance,
startingBalance:500,
positions:positions,
updatedAt:Date.now()

},{merge:true});


await setDoc(

doc(
db,
"leaderboards",
tournament,
"players",
user.uid
),

{

trader:user.email.split("@")[0],
email:user.email,
balance:balance,
startingBalance:500,
updatedAt:Date.now()

},{merge:true});

}


/* UI */

function ui(){

$("balance").textContent=balance.toFixed(2);
$("accountBalance").textContent=balance.toFixed(2);
$("userEmail").textContent=user.email;

}


/* TOURNAMENTS */

function drawTournaments(){

$("tournaments").innerHTML=
Object.entries(T).map(([id,t])=>`

<div class="market">

<b>${t.name}</b>

<p>Demo Entry: $${t.entry}</p>
<p>Duration: ${t.days} day(s)</p>

<button onclick="join('${id}')">
Open
</button>

</div>

`).join("");

}


window.join=async id=>{

tournament=id;

await load();

$("tname").textContent=T[id].name;

show("trade");

};


/* MARKETS */

function drawMarkets(){

$("markets").innerHTML=
Object.keys(M).map(x=>`

<div class="market">

<b>${x}</b>

<div class="price">
$${M[x].toFixed(2)}
</div>

<button onclick="trade('${x}')">
Trade
</button>

</div>

`).join("");

}


window.trade=x=>{

market=x;

$("marketName").textContent=x;
$("price").textContent=M[x].toFixed(2);

show("trade");

};


/* PRICE MOVEMENT */

setInterval(()=>{

for(let x in M){

old[x]=M[x];

M[x]+=M[x]*(Math.random()-.5)*.003;

}

drawMarkets();

if(market){

$("price").textContent=
M[market].toFixed(2);

let c=(M[market]-old[market])/
old[market]*100;

$("movement").textContent=
(c>=0?"+":"")+c.toFixed(3)+"%";

$("movement").className=
c>=0?"green":"redtext";

}

},1000);


/* BUY / SELL */

async function openTrade(type){

let amount=Number($("amount").value);

if(!market){

$("tradeMessage").textContent=
"Select a market.";

return;

}

if(!amount||amount<=0){

$("tradeMessage").textContent=
"Enter an amount.";

return;

}

if(amount>balance){

$("tradeMessage").textContent=
"Not enough demo balance.";

return;

}

balance-=amount;

positions.push({

market:market,
type:type,
amount:amount,
entry:M[market]

});

$("amount").value="";

$("tradeMessage").textContent=
"✅ Demo trade opened.";

await save();

drawPositions();

ui();

}


$("buy").onclick=
()=>openTrade("BUY");

$("sell").onclick=
()=>openTrade("SELL");


/* POSITIONS */

function drawPositions(){

if(!positions.length){

$("positions").textContent="None";

return;

}

$("positions").innerHTML=
positions.map((p,i)=>`

<div class="market">

<b>${p.type} ${p.market}</b>

<p>
Amount: $${p.amount.toFixed(2)}
</p>

<p>
Entry: $${p.entry.toFixed(2)}
</p>

<button class="red"
onclick="closeTrade(${i})">
Close
</button>

</div>

`).join("");

}


window.closeTrade=async i=>{

let p=positions[i];

let now=M[p.market];

let diff=now-p.entry;

let profit=
p.type=="BUY"
?diff/p.entry*p.amount
:-diff/p.entry*p.amount;

balance+=p.amount+profit;

positions.splice(i,1);

await save();

drawPositions();

ui();

};


/* LEADERBOARD SELECT */

$("boardSelect").innerHTML=
Object.entries(T).map(([id,t])=>
`<option value="${id}">
${t.name}
</option>`
).join("");

$("boardSelect").onchange=
leaderboard;


/* LIVE LEADERBOARD */

function leaderboard(){

if(unsubscribe)
unsubscribe();

let id=$("boardSelect").value;

let q=query(
collection(
db,
"leaderboards",
id,
"players"
),
orderBy("balance","desc")
);

unsubscribe=onSnapshot(q,snap=>{

let html="";
let rank=0;

snap.forEach(d=>{

rank++;

let x=d.data();

let profit=
Number(x.balance||0)-
Number(x.startingBalance||500);

html+=`

<tr>

<td>${rank}</td>

<td>${x.trader||"Trader"}</td>

<td>$${Number(x.balance||0).toFixed(2)}</td>

<td class="${
profit>=0?"green":"redtext"
}">
${profit>=0?"+":""}$
${profit.toFixed(2)}
</td>

</tr>

`;

});

$("board").innerHTML=
html||
`<tr><td colspan="4">
No players yet.
</td></tr>`;

$("boardStatus").textContent=
"🔴 LIVE — updates automatically.";

},e=>{

console.error(e);

$("boardStatus").textContent=
"Leaderboard permission error.";

});

}


/* AUTH RESTORE */

onAuthStateChanged(auth,async u=>{

if(u){

user=u;

$("loading").classList.add("hidden");
$("login").classList.add("hidden");
$("app").classList.remove("hidden");
$("nav").classList.remove("hidden");

await load();

drawTournaments();
drawMarkets();

show("home");

}else{

user=null;

$("loading").classList.add("hidden");
$("app").classList.add("hidden");
$("nav").classList.add("hidden");
$("login").classList.remove("hidden");

}

});

</script></body>
  </html>
