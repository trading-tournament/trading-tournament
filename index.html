<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TradeLeague Demo</title>

<style>
body{
margin:0;
background:#07111f;
color:#fff;
font-family:Arial,sans-serif
}

header{
text-align:center;
background:#111c2d;
padding:14px
}

h1{
color:#22c55e;
margin:0
}

main{
max-width:720px;
margin:auto;
padding:10px 10px 70px
}

.card{
background:#111c2d;
border:1px solid #26354a;
border-radius:12px;
padding:14px;
margin:10px 0
}

input,button,select{
width:100%;
padding:12px;
margin:5px 0;
border-radius:8px;
box-sizing:border-box
}

input,select{
background:#07111f;
color:#fff;
border:1px solid #334155
}

button{
background:#22c55e;
border:0;
font-weight:bold
}

.red{
background:#ef4444;
color:#fff
}

.gray{
background:#334155;
color:#fff
}

.hidden{
display:none
}

.green{
color:#22c55e
}

.redtext{
color:#ef4444
}

.yellow{
color:#facc15
}

.balance{
font-size:30px;
font-weight:bold
}

.price{
font-size:21px;
font-weight:bold
}

.market{
background:#0b1627;
padding:12px;
border-radius:9px;
margin:7px 0
}

.nav{
position:fixed;
bottom:0;
left:0;
right:0;
background:#111827;
display:flex
}

.nav button{
background:none;
color:#fff;
font-size:10px;
margin:0
}

table{
width:100%;
border-collapse:collapse
}

td,th{
padding:8px;
border-bottom:1px solid #26354a;
text-align:left
}

canvas{
width:100%;
height:190px;
background:#07111f;
border-radius:8px
}
</style>
</head>

<body>

<header>
<h1>🔥 TradeLeague</h1>
<small>DEMO TEST MODE</small>
</header>

<main>

<div id="loading" class="card">
Checking account...
</div>

<div id="login" class="card hidden">

<h2>🔐 Login</h2>

<input
id="email"
type="email"
placeholder="Email">

<input
id="password"
type="password"
placeholder="Password">

<button id="loginBtn">
Login
</button>

<button id="signupBtn" class="gray">
Create Account
</button>

<p id="message"></p>

</div>


<div id="app" class="hidden">

<section id="home">

<div class="card">

<h2 id="tname">
Starter Tournament
</h2>

<div class="balance">
$<span id="balance">500.00</span>
</div>

<p>
Time:
<b id="timer" class="yellow">--</b>
</p>

</div>


<div class="card">

<h2>🏆 Tournaments</h2>

<div id="tournaments"></div>

</div>


<div class="card">

<h2>🌍 Markets</h2>

<div id="markets"></div>

</div>

</section>


<section id="trade" class="hidden">

<div class="card">

<h2>
📈 <span id="marketName">Market</span>
</h2>

<div class="price">
$<span id="price">0</span>
</div>

<p>
Movement:
<b id="movement">0%</b>
</p>

<canvas id="chart"></canvas>

<input
id="amount"
type="number"
min="1"
placeholder="Demo amount">

<button id="buy">
🟢 BUY
</button>

<button id="sell" class="red">
🔴 SELL
</button>

<p id="tradeMessage"></p>

</div>


<div class="card">

<h3>Open Trades</h3>

<div id="positions">
None
</div>

</div>

</section>


<section id="rank" class="hidden">

<div class="card">

<h2>🏆 Live Leaderboard</h2>

<select id="boardSelect"></select>

<p>
Time:
<b id="boardTimer" class="yellow">--</b>
</p>

<table>

<thead>

<tr>
<th>#</th>
<th>Trader</th>
<th>Balance</th>
<th>Profit</th>
</tr>

</thead>

<tbody id="board">

<tr>
<td colspan="4">
Loading...
</td>
</tr>

</tbody>

</table>

<p id="boardStatus">
🔴 LIVE — updates automatically.
</p>

</div>

</section>


<section id="account" class="hidden">

<div class="card">

<h2>👤 Account</h2>

<p id="userEmail"></p>

<p>
Balance:
$<b id="accountBalance">500.00</b>
</p>

<button id="logout" class="red">
Logout
</button>

</div>

</section>

</div>

</main>


<nav id="nav" class="nav hidden">

<button onclick="show('home')">
🏠<br>Home
</button>

<button onclick="show('trade')">
📈<br>Trade
</button>

<button onclick="show('rank')">
🏆<br>Rank
</button>

<button onclick="show('account')">
👤<br>Account
</button>

</nav>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut,
setPersistence,
browserLocalPersistence
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


import {
getFirestore,
doc,
getDoc,
setDoc,
collection,
query,
orderBy,
onSnapshot
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


const firebaseConfig = {

apiKey:
"AIzaSyAV63UmB-gIWfj1lhshPcFqxaRV6j9O-F4",

authDomain:
"project-57e2c805-1b30-40ea-a94.firebaseapp.com",

projectId:
"project-57e2c805-1b30-40ea-a94",

storageBucket:
"project-57e2c805-1b30-40ea-a94.firebasestorage.app",

messagingSenderId:
"567705081329",

appId:
"1:567705081329:web:723f968a1eff122945e050",

measurementId:
"G-9P2H1ZNGSG"

};


const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


await setPersistence(
auth,
browserLocalPersistence
);


const $ = id =>
document.getElementById(id);


const tournaments = {

starter:{
name:"Starter Tournament",
entry:2,
days:6
},

five:{
name:"$5 Tournament",
entry:5,
days:1
},

ten:{
name:"$10 Tournament",
entry:10,
days:3
}

};


const markets = {

"BTC/USD":65000,

"ETH/USD":3200,

"Gold":2380,

"Apple":210,

"Tesla":240,

"Nvidia":120,

"EUR/USD":1.085,

"GBP/USD":1.274

};


const oldPrices = {...markets};

const historyPrices = {};

Object.keys(markets).forEach(
name=>{
historyPrices[name]=[
markets[name]
];
}
);


let user = null;

let tournament = "starter";

let balance = 500;

let positions = [];

let selectedMarket = null;

let unsubscribe = null;

let endAt = 0;


window.show = function(page){

[
"home",
"trade",
"rank",
"account"
].forEach(
p=>{
$(p).classList.add("hidden");
}
);

$(page).classList.remove("hidden");

if(page==="rank"){
loadLeaderboard();
}

};


$("loginBtn").onclick =
async function(){

try{

await signInWithEmailAndPassword(
auth,
$("email").value.trim(),
$("password").value
);

}catch(error){

$("message").textContent =
error.message;

}

};


$("signupBtn").onclick =
async function(){

try{

await createUserWithEmailAndPassword(
auth,
$("email").value.trim(),
$("password").value
);

}catch(error){

$("message").textContent =
error.message;

}

};


$("logout").onclick =
function(){

signOut(auth);

};


function playerRef(){

return doc(
db,
"tournaments",
tournament,
"players",
user.uid
);

}


async function loadPlayer(){

const snapshot =
await getDoc(
playerRef()
);


if(snapshot.exists()){

const data =
snapshot.data();

balance =
Number(data.balance ?? 500);

positions =
data.positions || [];

endAt =
Number(data.endAt || 0);

}else{

balance = 500;

positions = [];

endAt =
Date.now() +
tournaments[tournament].days *
86400000;


await setDoc(
playerRef(),
{

uid:user.uid,

trader:
user.email.split("@")[0],

email:user.email,

balance:500,

startingBalance:500,

positions:[],

endAt:endAt,

updatedAt:Date.now()

},
{merge:true}
);

}


updateUI();

drawPositions();

}


async function savePlayer(){

await setDoc(

playerRef(),

{

uid:user.uid,

trader:
user.email.split("@")[0],

email:user.email,

balance:balance,

startingBalance:500,

positions:positions,

endAt:endAt,

updatedAt:Date.now()

},

{merge:true}

);


await setDoc(

doc(
db,
"leaderboards",
tournament,
"players",
user.uid
),

{

uid:user.uid,

trader:
user.email.split("@")[0],

email:user.email,

balance:balance,

startingBalance:500,

updatedAt:Date.now()

},

{merge:true}

);

}


function updateUI(){

$("balance").textContent =
balance.toFixed(2);

$("accountBalance").textContent =
balance.toFixed(2);

$("userEmail").textContent =
user ? user.email : "";

$("tname").textContent =
tournaments[tournament].name;

}


function drawTournaments(){

let html = "";

for(
const id in tournaments
){

const t =
tournaments[id];

html += `

<div class="market">

<b>${t.name}</b>

<p>
Demo Entry:
$${t.entry}
</p>

<p>
Duration:
${t.days} day(s)
</p>

<button
onclick="joinTournament('${id}')">

Open

</button>

</div>

`;

}

$("tournaments").innerHTML =
html;

}


window.joinTournament =
async function(id){

tournament = id;

await loadPlayer();

show("trade");

};


function drawMarkets(){

let html = "";

for(
const name in markets
){

html += `

<div class="market">

<b>${name}</b>

<div class="price">

$${markets[name].toFixed(2)}

</div>

<button
onclick="openMarket('${name}')">

Trade

</button>

</div>

`;

}

$("markets").innerHTML =
html;

}


window.openMarket =
function(name){

selectedMarket = name;

$("marketName").textContent =
name;

$("price").textContent =
markets[name].toFixed(2);

drawChart();

show("trade");

};


function drawChart(){

if(!selectedMarket)
return;

const canvas =
$("chart");

const ctx =
canvas.getContext("2d");

const width =
canvas.clientWidth;

const height =
canvas.clientHeight;

canvas.width =
width;

canvas.height =
height;

ctx.clearRect(
0,
0,
width,
height
);


const values =
historyPrices[selectedMarket];

let min =
Math.min(...values);

let max =
Math.max(...values);

let range =
max-min;

if(range===0)
range=1;


ctx.beginPath();

ctx.lineWidth = 3;

ctx.strokeStyle =
markets[selectedMarket]
>=oldPrices[selectedMarket]
?
"#22c55e"
:
"#ef4444";


values.forEach(
(value,index)=>{

const x =
5 +
index /
(values.length-1) *
(width-10);

const y =
height-5 -
(value-min) /
range *
(height-10);


if(index===0)
ctx.moveTo(x,y);
else
ctx.lineTo(x,y);

}
);


ctx.stroke();

}


setInterval(
function(){

for(
const name in markets
){

oldPrices[name] =
markets[name];

markets[name] +=
markets[name] *
(Math.random()-0.5) *
0.003;

historyPrices[name].push(
markets[name]
);

if(
historyPrices[name].length>60
){

historyPrices[name].shift();

}

}


drawMarkets();


if(selectedMarket){

$("price").textContent =
markets[selectedMarket]
.toFixed(2);

const change =
(
markets[selectedMarket] -
oldPrices[selectedMarket]
) /
oldPrices[selectedMarket] *
100;


$("movement").textContent =
(change>=0?"+":"") +
change.toFixed(3) +
"%";


$("movement").className =
change>=0
?
"green"
:
"redtext";


drawChart();

}

},
1000
);


async function openTrade(type){

const amount =
Number(
$("amount").value
);


if(!selectedMarket){

$("tradeMessage").textContent =
"Select a market.";

return;

}


if(
!amount ||
amount<=0
){

$("tradeMessage").textContent =
"Enter an amount.";

return;

}


if(amount>balance){

$("tradeMessage").textContent =
"Not enough demo balance.";

return;

}


balance -= amount;


positions.push({

market:selectedMarket,

type:type,

amount:amount,

entry:markets[selectedMarket]

});


$("amount").value = "";

$("tradeMessage").textContent =
"✅ Demo trade opened.";


await savePlayer();

drawPositions();

updateUI();

}


$("buy").onclick =
function(){

openTrade("BUY");

};


$("sell").onclick =
function(){

openTrade("SELL");

};


function drawPositions(){

if(!positions.length){

$("positions").textContent =
"None";

return;

}


let html = "";

positions.forEach(
(p,index)=>{

html += `

<div class="market">

<b>
${p.type}
${p.market}
</b>

<p>
Amount:
$${p.amount.toFixed(2)}
</p>

<p>
Entry:
$${p.entry.toFixed(2)}
</p>

<button
class="red"
onclick="closeTrade(${index})">

Close

</button>

</div>

`;

}
);


$("positions").innerHTML =
html;

}


window.closeTrade =
async function(index){

const p =
positions[index];

if(!p)
return;


const current =
markets[p.market];

const difference =
current-p.entry;


let profit;


if(p.type==="BUY"){

profit =
difference /
p.entry *
p.amount;

}else{

profit =
-difference /
p.entry *
p.amount;

}


balance +=
p.amount +
profit;


positions.splice(
index,
1
);


await savePlayer();

drawPositions();

updateUI();

};


$("boardSelect").innerHTML =
Object.entries(tournaments)
.map(
([id,t])=>
`
<option value="${id}">
${t.name}
</option>
`
)
.join("");


$("boardSelect").onchange =
function(){

loadLeaderboard();

};


function loadLeaderboard(){

if(!user)
return;


if(unsubscribe){

unsubscribe();

unsubscribe = null;

}


const id =
$("boardSelect").value;


const leaderboardQuery =
query(

collection(
db,
"leaderboards",
id,
"players"
),

orderBy(
"balance",
"desc"
)

);


unsubscribe =
onSnapshot(

leaderboardQuery,

snapshot=>{

let html = "";

let rank = 0;


snapshot.forEach(
docSnap=>{

rank++;


const data =
docSnap.data();


const current =
Number(
data.balance || 0
);


const starting =
Number(
data.startingBalance || 500
);


const profit =
current-starting;


html += `

<tr>

<td>
${rank}
</td>

<td>
${data.trader || "Trader"}
</td>

<td>
$${current.toFixed(2)}
</td>

<td class="${
profit>=0
?
"green"
:
"redtext"
}">

${profit>=0?"+":""}
$${profit.toFixed(2)}

</td>

</tr>

`;

}
);


$("board").innerHTML =
html ||
`
<tr>
<td colspan="4">
No players yet.
</td>
</tr>
`;


$("boardStatus").textContent =
"🔴 LIVE — updates automatically.";

},

error=>{

console.error(error);

$("boardStatus").textContent =
"Leaderboard permission error: " +
error.code;

}

);

}


setInterval(
function(){

if(!endAt)
return;


const remaining =
Math.max(
0,
endAt-Date.now()
);


const seconds =
Math.floor(
remaining/1000
);


const days =
Math.floor(
seconds/86400
);


const hours =
Math.floor(
(seconds%86400)/3600
);


const minutes =
Math.floor(
(seconds%3600)/60
);


const secs =
seconds%60;


const text =
days+"d "+
String(hours).padStart(2,"0")+":"+
String(minutes).padStart(2,"0")+":"+
String(secs).padStart(2,"0");


$("timer").textContent =
text;

$("boardTimer").textContent =
text;

},
1000
);


onAuthStateChanged(
auth,
async function(currentUser){

if(currentUser){

user =
currentUser;


$("loading")
.classList.add("hidden");

$("login")
.classList.add("hidden");

$("app")
.classList.remove("hidden");

$("nav")
.classList.remove("hidden");


await loadPlayer();

drawTournaments();

drawMarkets();

show("home");


}else{

user = null;


$("loading")
.classList.add("hidden");

$("app")
.classList.add("hidden");

$("nav")
.classList.add("hidden");

$("login")
.classList.remove("hidden");

}

}
);

</script>

</body>
  </html>
