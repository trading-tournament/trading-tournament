<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TradeLeague</title>  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #07111f;
      color: white;
    }

    header {
      text-align: center;
      padding: 35px 15px;
      background: linear-gradient(135deg, #0f172a, #064e3b);
    }

    h1 {
      color: #22c55e;
      margin: 0;
      font-size: 36px;
    }

    .container {
      max-width: 500px;
      margin: 30px auto;
      padding: 15px;
    }

    .card {
      background: #111c2d;
      border: 1px solid #26354a;
      border-radius: 15px;
      padding: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 7px 0;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #08111f;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 0;
      border-radius: 8px;
      background: #22c55e;
      color: #04110a;
      font-weight: bold;
      font-size: 16px;
    }

    .login {
      background: #334155;
      color: white;
    }

    .logout {
      background: #ef4444;
      color: white;
    }

    .hidden {
      display: none;
    }

    #message {
      margin-top: 15px;
      padding: 12px;
      background: #1e293b;
      border-radius: 8px;
      word-break: break-word;
    }

    .success {
      color: #86efac;
    }

    .error {
      color: #fca5a5;
    }
  </style></head><body><header>
  <h1>🔥 TradeLeague</h1>
  <p>Compete. Trade. Climb the leaderboard.</p>
</header><div class="container">  <!-- ACCOUNT PAGE -->  <div id="authBox" class="card"><h2>🔐 Create Account</h2>

<input
  id="email"
  type="email"
  placeholder="Enter your email"
>

<input
  id="password"
  type="password"
  placeholder="Enter password"
>

<button id="signup">
  Create Account
</button>

<button id="login" class="login">
  Login
</button>

<div id="message">
  Not logged in.
</div>

  </div>  <!-- HOME PAGE -->  <div id="homeBox" class="card hidden"><h2>🔥 Welcome to TradeLeague</h2>

<p>
  You are successfully logged in.
</p>

<p>
  Account:
  <strong id="userEmail"></strong>
</p>

<button id="logout" class="logout">
  Logout
</button>

  </div></div><script type="module">

  /* FIREBASE */

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

  import {
    getFirestore,
    doc,
    setDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


  /* YOUR FIREBASE PROJECT */

  const firebaseConfig = {

    apiKey:
      "AIzaSyAV63UmB-gIWfj1lhshPcFqxaRV6j9O-F4",

    authDomain:
      "project-57e2c805-1b30-40ea-a94.firebaseapp.com",

    projectId:
      "project-57e2c805-1b30-40ea-a94",

    storageBucket:
      "project-57e2c805-1b30-40ea-a94.firebasestorage.app",

    messagingSenderId:
      "567705081329",

    appId:
      "1:567705081329:web:723f968a1eff122945e050"

  };


  const app =
    initializeApp(firebaseConfig);

  const auth =
    getAuth(app);

  const db =
    getFirestore(app);


  /* ELEMENTS */

  const email =
    document.getElementById("email");

  const password =
    document.getElementById("password");

  const message =
    document.getElementById("message");

  const authBox =
    document.getElementById("authBox");

  const homeBox =
    document.getElementById("homeBox");

  const userEmail =
    document.getElementById("userEmail");


  /* CREATE ACCOUNT */

  document
    .getElementById("signup")
    .onclick = async function() {

      const emailValue =
        email.value.trim();

      const passwordValue =
        password.value;


      if (!emailValue || !passwordValue) {

        message.textContent =
          "Enter your email and password.";

        message.className =
          "error";

        return;

      }


      if (passwordValue.length < 6) {

        message.textContent =
          "Password must be at least 6 characters.";

        message.className =
          "error";

        return;

      }


      try {

        message.textContent =
          "Creating account...";


        const result =
          await createUserWithEmailAndPassword(
            auth,
            emailValue,
            passwordValue
          );


        const user =
          result.user;


        /* SAVE USER TO FIRESTORE */

        await setDoc(
          doc(db, "users", user.uid),
          {
            uid: user.uid,
            email: user.email,
            createdAt: serverTimestamp()
          }
        );


        message.textContent =
          "✅ Account created successfully!";

        message.className =
          "success";


      } catch (error) {

        console.error(error);

        message.textContent =
          "❌ " + error.message;

        message.className =
          "error";

      }

    };


  /* LOGIN */

  document
    .getElementById("login")
    .onclick = async function() {

      const emailValue =
        email.value.trim();

      const passwordValue =
        password.value;


      if (!emailValue || !passwordValue) {

        message.textContent =
          "Enter your email and password.";

        message.className =
          "error";

        return;

      }


      try {

        message.textContent =
          "Logging in...";


        await signInWithEmailAndPassword(
          auth,
          emailValue,
          passwordValue
        );


        message.textContent =
          "✅ Login successful!";

        message.className =
          "success";


      } catch (error) {

        console.error(error);

        message.textContent =
          "❌ " + error.message;

        message.className =
          "error";

      }

    };


  /* LOGOUT */

  document
    .getElementById("logout")
    .onclick = async function() {

      await signOut(auth);

    };


  /* LOGIN STATUS */

  onAuthStateChanged(
    auth,
    function(user) {

      if (user) {

        authBox.classList.add("hidden");

        homeBox.classList.remove("hidden");

        userEmail.textContent =
          user.email;

      } else {

        authBox.classList.remove("hidden");

        homeBox.classList.add("hidden");

      }

    }
  );

</script></body>
</html>
